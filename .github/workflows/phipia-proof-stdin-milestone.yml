name: Phipia interactive userspace evidence

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
    push:
        tags: [v1.1.0]

permissions:
    contents: read

concurrency:
    group: phipia-proof-stdin-milestone-${{ github.ref }}
    cancel-in-progress: true

jobs:
    measure-cat:
        name: phipia-interactive-userspace-evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Install build and trace tools
              shell: bash
              run: |
                  set -euo pipefail
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils build-essential bzip2 file qemu-user strace
            - name: Build, trace, and reproduce cat
              shell: bash
              run: |
                  set -euo pipefail
                  bash tools/build-busybox-cat-proof.sh \
                      build/cat-measure/one build/cat-measure/work-one
                  bash tools/build-busybox-cat-proof.sh \
                      build/cat-measure/two build/cat-measure/work-two
                  cmp build/cat-measure/one/busybox \
                      build/cat-measure/two/busybox
                  cmp build/cat-measure/one/syscall-sequence.txt \
                      build/cat-measure/two/syscall-sequence.txt
                  (
                      cd build/cat-measure/one
                      ld -r -b binary busybox -o busybox-blob.o
                      gcc -std=c11 -O2 -fPIE -pie -Wall -Wextra -Werror \
                          -Wpedantic -Wshadow -Wconversion \
                          -Wl,-z,noexecstack \
                          ../../../tools/linux-cat-stack-launcher.c \
                          ../../../tools/linux-abi-stack-launcher.S \
                          busybox-blob.o -o minimal-stack-launcher
                      printf 'pebble\n' | strace --quiet=all \
                          --raw=read,write \
                          --output=minimal-stack-syscall-trace.txt \
                          ./minimal-stack-launcher \
                          >minimal-stack-stdout.txt \
                          2>minimal-stack-stderr.txt
                      printf 'pebble\n' | cmp --silent - \
                          minimal-stack-stdout.txt
                      test ! -s minimal-stack-stderr.txt
                  )
                  cat build/cat-measure/one/build-record.txt
                  cat build/cat-measure/one/elf-program-headers.txt
                  cat build/cat-measure/one/syscall-trace.txt
                  cat build/cat-measure/one/raw-read-write-trace.txt
                  cat build/cat-measure/one/minimal-stack-syscall-trace.txt
            - name: Upload measured cat evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: phipia-busybox-cat-measurement-${{ github.sha }}
                  path: build/cat-measure/one
                  if-no-files-found: error
                  retention-days: 30

    bounded-evidence:
        name: bounded-interactive-userspace-evidence
        needs: measure-cat
        runs-on: ubuntu-24.04
        timeout-minutes: 240
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Install build, trace, capture, and emulation tools
              shell: bash
              run: |
                  set -euo pipefail
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils build-essential bzip2 clang ffmpeg file grub-common \
                      grub-pc-bin lld make mtools qemu-system-x86 qemu-user \
                      strace xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Verify source, kernel, parsers, and deterministic volume
              shell: bash
              run: |
                  set -euo pipefail
                  make verify
                  git diff --check
                  cp build/userspace/phipia-userland-fat16.raw \
                      build/phipia-userland-first.raw
                  rm build/userspace/phipia-userland-fat16.raw
                  make build/userspace/phipia-userland-fat16.raw
                  cmp build/phipia-userland-first.raw \
                      build/userspace/phipia-userland-fat16.raw
                  test "$(sha256sum build/userspace/phipia-userland-fat16.raw | awk '{print toupper($1)}')" = \
                      C2A2B2FEC703C654E1260EF07A91FF1DD7808F8D83734C0D7AFD3967525B34B9
            - name: Rebuild and trace all measured profiles twice
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf build/release-echo build/release-uname \
                      build/release-cat
                  bash tools/build-busybox-proof.sh \
                      build/release-echo/one build/release-echo/work-one
                  bash tools/build-busybox-proof.sh \
                      build/release-echo/two build/release-echo/work-two
                  cmp build/release-echo/one/busybox \
                      build/release-echo/two/busybox
                  cmp build/release-echo/one/syscall-sequence.txt \
                      build/release-echo/two/syscall-sequence.txt
                  bash tools/build-busybox-uname-proof.sh \
                      build/release-uname/one build/release-uname/work-one
                  bash tools/build-busybox-uname-proof.sh \
                      build/release-uname/two build/release-uname/work-two
                  cmp build/release-uname/one/busybox \
                      build/release-uname/two/busybox
                  cmp build/release-uname/one/syscall-sequence.txt \
                      build/release-uname/two/syscall-sequence.txt
                  bash tools/build-busybox-cat-proof.sh \
                      build/release-cat/one build/release-cat/work-one
                  bash tools/build-busybox-cat-proof.sh \
                      build/release-cat/two build/release-cat/work-two
                  cmp build/release-cat/one/busybox \
                      build/release-cat/two/busybox
                  cmp build/release-cat/one/syscall-sequence.txt \
                      build/release-cat/two/syscall-sequence.txt
                  cmp build/release-echo/one/busybox \
                      build/busybox-contract/busybox
                  cmp build/release-uname/one/busybox \
                      build/busybox-uname-contract/busybox
                  cmp build/release-cat/one/busybox \
                      build/busybox-cat-contract/busybox
            - name: Run every declared QEMU scenario individually
              shell: bash
              run: |
                  set -euo pipefail
                  read -r expected_scenarios expected_assertions < <(
                      make --no-print-directory -s contract-counts
                  )
                  scenario_count=$(
                      make --no-print-directory -s contract-scenarios | wc -l
                  )
                  assertion_count=$(grep -c 'grep -F\|grep -E' Makefile)
                  test "$expected_scenarios" -eq 117
                  test "$scenario_count" -eq "$expected_scenarios"
                  test "$assertion_count" -eq "$expected_assertions"
                  make qemu-tests QEMU_ACCEL=tcg \
                      | tee build/all-qemu-scenarios.txt
                  test "$(grep -Ec '^QEMU scenario [a-z0-9-]+ passed$' \
                      build/all-qemu-scenarios.txt)" -eq 117
            - name: Capture authentic interactive Phipia evidence
              if: github.ref == 'refs/tags/v1.1.0'
              shell: bash
              run: |
                  set -euo pipefail
                  make iso
                  python3 tools/capture-phipia-proof.py \
                      --iso build/phipia.iso \
                      --userspace build/userspace/phipia-userland-fat16.raw \
                      --interaction cat \
                      --output build/release-captures
                  file build/release-captures/phipia-phipia-proof-terminal.png \
                      | grep -Fq 'PNG image data, 1024 x 768'
                  grep -Fq \
                      'RW USERLAND launch completed successfully cat ordinal 1' \
                      build/release-captures/capture-serial.log
                  python3 tools/capture-boot-video.py \
                      --iso build/phipia.iso \
                      --userspace build/userspace/phipia-userland-fat16.raw \
                      --ffmpeg ffmpeg --interaction cat \
                      --output build/phipia-phipia-proof-cat-boot-20s.mp4
                  ffprobe -v error -show_entries format=duration \
                      -of default=noprint_wrappers=1:nokey=1 \
                      build/phipia-phipia-proof-cat-boot-20s.mp4 \
                      | grep -Eq '^20(\.0+)?$'
            - name: Assemble v1.1.0 release evidence
              if: github.ref == 'refs/tags/v1.1.0'
              shell: bash
              run: |
                  set -euo pipefail
                  release=evidence/Phipia-v1.1.0
                  mkdir -p "$release"
                  cp build/phipia.iso "$release/Phipia-v1.1.0.iso"
                  cp build/phipia.elf "$release/phipia-v1.1.0.elf"
                  cp build/userspace/phipia-userland-fat16.raw \
                      "$release/phipia-v1.1.0-userspace-fat16.raw"
                  cp build/release-echo/one/busybox \
                      "$release/busybox-echo"
                  cp build/release-uname/one/busybox \
                      "$release/busybox-uname"
                  cp build/release-cat/one/busybox \
                      "$release/busybox-cat"
                  cp userspace/busybox/busybox.config \
                      userspace/busybox/busybox-uname.config \
                      userspace/busybox/busybox-cat.config "$release/"
                  cp userspace/busybox/BUSYBOX-LICENSE \
                      userspace/busybox/MUSL-COPYRIGHT "$release/"
                  cp userspace/busybox/source/busybox-1.38.0.tar.bz2 \
                      userspace/busybox/source/musl-1.2.6.tar.gz "$release/"
                  cp userspace/busybox/syscall-allowlist.txt \
                      "$release/echo-syscall-allowlist.txt"
                  cp userspace/busybox/uname-syscall-allowlist.txt \
                      userspace/busybox/uname-syscall-sequence.txt \
                      userspace/busybox/cat-syscall-allowlist.txt \
                      userspace/busybox/cat-syscall-sequence.txt "$release/"
                  cp build/release-echo/one/syscall-trace.txt \
                      "$release/echo-host-syscall-trace.txt"
                  cp build/release-uname/one/syscall-trace.txt \
                      "$release/uname-host-syscall-trace.txt"
                  cp build/release-cat/one/syscall-trace.txt \
                      "$release/cat-host-syscall-trace.txt"
                  cp build/release-echo/one/build-record.txt \
                      "$release/echo-reproducible-build-record.txt"
                  cp build/release-uname/one/build-record.txt \
                      "$release/uname-reproducible-build-record.txt"
                  cp build/release-cat/one/build-record.txt \
                      "$release/cat-reproducible-build-record.txt"
                  cp tools/build-busybox-proof.sh \
                      tools/build-busybox-uname-proof.sh \
                      tools/build-busybox-cat-proof.sh \
                      tools/check-exercised-instructions.py \
                      tools/make-phipia-proof-userland.py \
                      tools/linux-abi-stack-launcher.S \
                      tools/linux-cat-stack-launcher.c "$release/"
                  cp userspace/busybox/musl-vfprintf-scalar.h "$release/"
                  cp docs/LINUX_SYSCALL_ABI.md \
                      "$release/cat-stdin-stdout-contract.md"
                  cp build/tests/phipia-proof-userland-interactive/serial.log \
                      "$release/interactive-positive-serial.log"
                  cp build/tests/phipia-proof-userland-interactive-absent/serial.log \
                      "$release/interactive-absent-serial.log"
                  grep -E 'RW CAT|RW USERLAND' \
                      build/tests/phipia-proof-userland-interactive/serial.log \
                      >"$release/foreground-lifecycle-trace.log"
                  cp build/all-qemu-scenarios.txt "$release/"
                  cp build/release-captures/phipia-phipia-proof-terminal.png \
                      "$release/phipia-proof-linux-cat.png"
                  cp build/release-captures/capture-serial.log \
                      "$release/interactive-media-serial.log"
                  cp build/phipia-phipia-proof-cat-boot-20s.mp4 \
                      "$release/phipia-proof-linux-cat-boot-20s.mp4"
                  {
                      printf 'Phipia v1.1.0 bounded Phipia userspace volume\n'
                      printf 'logical sectors / bytes: 4096 / 4096\n'
                      printf 'FAT: LBA 1-2; root: LBA 3, 128 entries\n'
                      printf 'BUSYBOX: clusters 2-10, 33584 bytes\n'
                      printf 'UNAMEBOX: clusters 11-20, 38368 bytes\n'
                      printf 'CATBOX: clusters 21-30, 38632 bytes\n'
                      printf 'volume SHA-256: C2A2B2FEC703C654E1260EF07A91FF1DD7808F8D83734C0D7AFD3967525B34B9\n'
                  } >"$release/userspace-volume-layout.txt"
                  {
                      printf 'Positive: linux cat completed twice with different lines and Ctrl-D through Phipia keyboard events.\n'
                      printf 'Positive: authentic read, write, and exit SYSCALL entries, exact userspace stdout, fresh generations, and prompt restoration were observed.\n'
                      printf 'Negative: missing CATBOX was refused while echo and uname remained valid; a later measured command completed.\n'
                      printf 'Negative: FAT16 metadata, payload digest, ELF64 shape, read fd/ranges, saved frame, generation, duplicate completion, overflow, ownership, and teardown controls passed.\n'
                      printf 'Recovery: failed and completed launches retained no mappings, frame, input, output owner, or active generation.\n'
                  } >"$release/positive-negative-robustness-results.txt"
                  read -r scenarios assertions < <(
                      make --no-print-directory -s contract-counts
                  )
                  {
                      printf 'Phipia v1.1.0 Phipia interactive userspace verification\n'
                      printf 'commit: %s\n' "$GITHUB_SHA"
                      printf 'tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
                      printf 'make verify: passed without warnings\n'
                      printf 'QEMU scenarios: %s passed individually\n' "$scenarios"
                      printf 'structural shell assertions: %s passed\n' "$assertions"
                      printf 'BusyBox reproducibility: two clean builds per profile were byte-identical\n'
                      printf 'FAT16 reproducibility: two reconstructions were byte-identical\n'
                      printf 'instruction audits: no floating point, MMX, SSE, or AVX on exercised kernel or userspace paths\n'
                      printf 'Phipia: production shell and keyboard paths ran cat twice and restored the prompt\n'
                      printf 'execution: authentic x86_64 read, write, and exit SYSCALL entries under fresh private CPL3 address spaces\n'
                      printf 'teardown: mappings, saved frame, input, stdout owner, and generation released\n'
                      printf 'media: screenshot and 20-second video captured from this commit in QEMU\n'
                      printf 'scope: bounded v1.1.0 profiles only; no POSIX, general stdin, TTY, production, broad Linux, or stable userspace ABI claim\n'
                  } >"$release/verification-summary.txt"
                  rm -f "$release/SHA256SUMS"
                  manifest=$(mktemp "$RUNNER_TEMP/phipia-v1.1.0-sha256.XXXXXX")
                  (
                      cd "$release"
                      find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
                          | sort -z | xargs -0 sha256sum >"$manifest"
                  )
                  mv "$manifest" "$release/SHA256SUMS"
                  (
                      cd evidence
                      tar -czf Phipia-v1.1.0-evidence.tar.gz Phipia-v1.1.0
                  )
                  cat "$release/verification-summary.txt"
                  cat "$release/SHA256SUMS"
            - name: Upload v1.1.0 milestone evidence
              if: github.ref == 'refs/tags/v1.1.0'
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: Phipia-v1.1.0-evidence-${{ github.sha }}
                  path: evidence
                  if-no-files-found: error
                  retention-days: 90
