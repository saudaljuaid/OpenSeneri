name: Phipia filesystem compatibility and FAT32 persistence

on:
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            ext4_only:
                description: Run bounded ext4 gates only (not full milestone certification)
                type: boolean
                default: false
            ext4_boot_probe:
                description: Diagnostic kernel and targeted ext4 recovery cases (no milestone gate credit)
                type: boolean
                default: false
            ext4_application_probe:
                description: Diagnostic desktop cold-boot journey only (not full milestone verification)
                type: boolean
                default: false
            ext4_cut_operation:
                description: Focused VFS or power-cut diagnostic (requires ext4_boot_probe; all preserves the complete probe)
                type: choice
                default: all
                options: [all, vfs, journal-wrap, dense-file, geometry, admission-refusals, storage-refusals, metadata-device-cuts, chmod-device, times-device, xattr-device, xattr-remove-device, unlink, replace, rename, rename-errors, rename-device, rename-cross, rename-cross-errors, rename-cross-device, rename-wrap-device, truncate, truncate-errors, truncate-device, grow, grow-errors, grow-device, append, append-errors, append-device, overwrite, overwrite-errors, chmod, chmod-errors, times, times-errors, create, create-errors, create-device, mkdir, mkdir-errors, rmdir, rmdir-errors, xattr, xattr-errors, xattr-remove, xattr-remove-errors, link, link-errors, symlink, symlink-errors, symlink-long, symlink-long-errors]

permissions:
    contents: read

concurrency:
    group: filesystem-compatibility-${{ github.ref }}${{ inputs.ext4_application_probe && '-ext4-app-probe' || (inputs.ext4_boot_probe && '-ext4-probe' || (inputs.ext4_only && '-ext4' || '')) }}
    cancel-in-progress: true

jobs:
    bounded-evidence:
        name: filesystem-compatibility-evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 360
        env:
            PHIPIA_EXT4_KERNEL_INTEROP: "1"
            PHIPIA_EXT4_CUT_OPERATION: ${{ inputs.ext4_cut_operation || 'all' }}
            # Exact Ubuntu package used by the successful 8520fa7 evidence.
            PHIPIA_E2FSPROGS_VERSION: "1.47.0-2.4~exp1ubuntu4.1"
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Install build tools
              run: |
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils bzip2 clang "e2fsprogs=$PHIPIA_E2FSPROGS_VERSION" ffmpeg file gcc grub-common \
                      grub-pc-bin lld make \
                      mtools qemu-system-x86 xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Record the emulated surface
              shell: bash
              run: |
                  mkdir -p evidence/filesystem evidence/ext4
                  test "$(dpkg-query -W -f='${Version}' e2fsprogs)" = "$PHIPIA_E2FSPROGS_VERSION"
                  dpkg-query -s e2fsprogs >evidence/ext4/e2fsprogs-package.txt
                  for tool in mke2fs e2fsck debugfs dumpe2fs; do
                      executable="$(command -v "$tool")"
                      sha256sum "$executable"
                      "$executable" -V 2>&1
                      ldd "$executable"
                  done >evidence/ext4/e2fsprogs-binaries.txt
                  qemu-system-x86_64 -version \
                      | tee evidence/filesystem/qemu-version.txt
                  qemu-system-x86_64 -device nvme,help \
                      | tee evidence/filesystem/qemu-nvme-help.txt
                  qemu-system-x86_64 -accel help \
                      | tee evidence/filesystem/accelerator-help.txt
            - name: Verify the kernel artifact
              if: ${{ !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              env:
                  PHIPIA_EXT4_KERNEL_INTEROP: "1"
              shell: bash
              run: |
                  set -o pipefail
                  mkdir -p evidence/ext4
                  git rev-parse HEAD >evidence/ext4/head.txt
                  if [[ "$PHIPIA_EXT4_CUT_OPERATION" != 'all' ]]; then
                      echo 'A selected cut requires the explicit boot diagnostic mode.'
                      exit 1
                  fi
                  make verify 2>&1 | tee evidence/ext4/verify.log
            - name: Build the diagnostic kernel (not milestone verification)
              if: ${{ inputs.ext4_boot_probe || inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  mkdir -p evidence/ext4
                  git rev-parse HEAD >evidence/ext4/head.txt
                  if [[ '${{ inputs.ext4_boot_probe }}' == 'true' && '${{ inputs.ext4_application_probe }}' == 'true' ]]; then
                      echo 'Choose only one diagnostic mode.'
                      exit 1
                  fi
                  if [[ "$PHIPIA_EXT4_CUT_OPERATION" != 'all' && '${{ inputs.ext4_boot_probe }}' != 'true' ]]; then
                      echo 'A selected cut requires the explicit boot diagnostic mode.'
                      exit 1
                  fi
                  case "$PHIPIA_EXT4_CUT_OPERATION" in
                      all|vfs|journal-wrap|dense-file|geometry|admission-refusals|storage-refusals|metadata-device-cuts|chmod-device|times-device|xattr-device|xattr-remove-device|unlink|replace|rename|rename-errors|rename-device|rename-cross|rename-cross-errors|rename-cross-device|rename-wrap-device|truncate|truncate-errors|truncate-device|grow|grow-errors|grow-device|append|append-errors|append-device|overwrite|overwrite-errors|chmod|chmod-errors|times|times-errors|create|create-errors|create-device|mkdir|mkdir-errors|rmdir|rmdir-errors|xattr|xattr-errors|xattr-remove|xattr-remove-errors|link|link-errors|symlink|symlink-errors|symlink-long|symlink-long-errors) ;;
                      *) echo 'Unsupported cut diagnostic.'; exit 1 ;;
                  esac
                  printf '%s\n' 'Targeted ext4 diagnostic only; all milestone gates remain required.' \
                      >evidence/ext4/DIAGNOSTIC-ONLY.txt
                  make kernel lint 2>&1 | tee evidence/ext4/diagnostic-build.log
                  make build/notes-ext4-host-test
                  build/notes-ext4-host-test 2>&1 | tee evidence/ext4/application-publication-host.log
                  make build/ui-animation-clip-host-test
                  build/ui-animation-clip-host-test 2>&1 | tee evidence/ext4/application-animation-host.log
                  make build/shell-ext4-host-test
                  build/shell-ext4-host-test 2>&1 | tee evidence/ext4/application-input-host.log
                  make build/vfs-mutation-host-test
                  build/vfs-mutation-host-test 2>&1 | tee evidence/ext4/vfs-mutation-host.log
                  make build/ext4-vfs-host-test build/ext4-handle-claims-host-test
                  build/ext4-vfs-host-test 2>&1 | tee evidence/ext4/ext4-vfs-host.log
                  build/ext4-handle-claims-host-test 2>&1 | tee evidence/ext4/ext4-handle-claims-host.log
                  make build/vfs-file-claims-host-test build/vfs-directory-claims-host-test
                  build/vfs-file-claims-host-test 2>&1 | tee evidence/ext4/vfs-file-claims-host.log
                  build/vfs-directory-claims-host-test 2>&1 | tee evidence/ext4/vfs-directory-claims-host.log
                  make build/vfs-vnode-host-test
                  build/vfs-vnode-host-test 2>&1 | tee evidence/ext4/vfs-vnode-host.log
                  make build/vfs-mount-host-test
                  build/vfs-mount-host-test 2>&1 | tee evidence/ext4/vfs-mount-host.log
                  make build/vfs-directory-host-test
                  build/vfs-directory-host-test 2>&1 | tee evidence/ext4/vfs-directory-host.log
                  make build/ext4-append-contention-host-test
                  build/ext4-append-contention-host-test 2>&1 | tee evidence/ext4/ext4-append-contention-host.log
                  make build/ext4-registry-host-test
                  build/ext4-registry-host-test 2>&1 | tee evidence/ext4/ext4-registry-host.log
                  make build/ext4-storage-cut-host-test
                  build/ext4-storage-cut-host-test 2>&1 | tee evidence/ext4/ext4-storage-cut-host.log
                  make build/keyboard-channel-host-test
                  build/keyboard-channel-host-test 2>&1 | tee evidence/ext4/application-keyboard-host.log
                  python3 tools/ext4_guest_capture_test.py 2>&1 | tee evidence/ext4/guest-capture-host.log
                  make package-upload-tests 2>&1 | tee evidence/ext4/package-upload-host.log
                  make package-service-tests 2>&1 | tee evidence/ext4/package-service-host.log
                  make package-control-tests 2>&1 | tee evidence/ext4/package-control-host.log
                  CARGO_TARGET_DIR="$PWD/build/ext4-transaction-target" \
                      cargo test --manifest-path tools/ext4-transaction-tests/Cargo.toml \
                          --locked --offline --test revoke_allocations -- --nocapture \
                          2>&1 | tee evidence/ext4/revoke-allocation-host.log
                  if [[ '${{ inputs.ext4_application_probe }}' == 'true' ]]; then
                      printf '%s\n' 'Application probe: full host, recovery and release suites remain required.' \
                          >evidence/ext4/APPLICATION-PROBE.txt
                      exit 0
                  fi
                  make build/tests/ext4/phipia-ext4.raw
                  export PHIPIA_EXT4_RUST_FIXTURE="$PWD/build/tests/ext4/phipia-ext4.raw"
                  export CARGO_TARGET_DIR="$PWD/build/ext4-transaction-target"
                  if [[ "$PHIPIA_EXT4_CUT_OPERATION" == 'storage-refusals' ]]; then
                      cargo test --manifest-path tools/ext4-transaction-tests/Cargo.toml \
                          --locked --offline --lib --test coordinator -- --nocapture \
                          2>&1 | tee evidence/ext4/journal-and-coordinator-host.log
                      exit 0
                  fi
                  for regression in admitted_fixture_has_complete_storage_and_namespace_census \
                      namespace_counts_parents_types_and_unique_names_are_checked_before_mutation \
                      real_inode_exhaustion_rolls_back_namespace_and_reuses_a_freed_inode \
                      wide_nested_directory_census_preserves_paths_parents_and_mutation_reload \
                      extent_data_and_nodes_cannot_be_shared_between_live_or_orphan_inodes \
                      external_xattr_checksums_shared_release_and_final_free \
                      commit_reload_failure_hides_view_and_retry_does_not_rewrite_storage; do
                      cargo test --manifest-path tools/ext4-transaction-tests/Cargo.toml \
                          --locked --offline --test coordinator "$regression" -- --exact --nocapture \
                          2>&1 | tee "evidence/ext4/${regression}.log"
                  done
            - name: Exercise ext4 VFS recovery and durability boundaries
              if: ${{ !cancelled() && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  targets=(qemu-test-ext4-recovery)
                  if [[ '${{ inputs.ext4_boot_probe }}' != 'true' ]]; then
                      targets+=(qemu-test-ext4-powercuts)
                  else
                      targets+=(qemu-test-ext4-replace-powercuts qemu-test-ext4-truncate-powercuts qemu-test-ext4-grow-powercuts qemu-test-ext4-create-powercuts qemu-test-ext4-mkdir-powercuts qemu-test-ext4-rmdir-powercuts qemu-test-ext4-xattr-powercuts qemu-test-ext4-xattr-remove-powercuts qemu-test-ext4-link-powercuts qemu-test-ext4-symlink-powercuts qemu-test-ext4-symlink-long-powercuts)
                      targets+=(qemu-test-ext4-append-powercuts)
                      targets+=(qemu-test-ext4-overwrite-powercuts)
                      targets+=(qemu-test-ext4-overwrite-errors-powercuts)
                      targets+=(qemu-test-ext4-append-errors-powercuts)
                      targets+=(qemu-test-ext4-truncate-errors-powercuts qemu-test-ext4-grow-errors-powercuts)
                      targets+=(qemu-test-ext4-create-errors-powercuts qemu-test-ext4-create-device-powercuts)
                      targets+=(qemu-test-ext4-mkdir-errors-powercuts qemu-test-ext4-rmdir-errors-powercuts)
                      targets+=(qemu-test-ext4-link-errors-powercuts qemu-test-ext4-symlink-errors-powercuts qemu-test-ext4-symlink-long-errors-powercuts)
                      targets+=(qemu-test-ext4-chmod-powercuts qemu-test-ext4-times-powercuts)
                      targets+=(qemu-test-ext4-chmod-errors-powercuts qemu-test-ext4-times-errors-powercuts)
                      targets+=(qemu-test-ext4-chmod-device-powercuts qemu-test-ext4-times-device-powercuts qemu-test-ext4-xattr-device-powercuts qemu-test-ext4-xattr-remove-device-powercuts)
                      targets+=(qemu-test-ext4-xattr-errors-powercuts qemu-test-ext4-xattr-remove-errors-powercuts)
                      targets+=(qemu-test-ext4-rename-powercuts qemu-test-ext4-rename-cross-powercuts)
                      targets+=(qemu-test-ext4-rename-errors-powercuts qemu-test-ext4-rename-cross-errors-powercuts)
                      targets+=(qemu-test-ext4-rename-device-powercuts qemu-test-ext4-rename-cross-device-powercuts)
                      targets+=(qemu-test-ext4-append-device-powercuts qemu-test-ext4-truncate-device-powercuts qemu-test-ext4-grow-device-powercuts)
                      targets+=(qemu-test-ext4-journal-wrap)
                      targets+=(qemu-test-ext4-dense-file qemu-test-ext4-geometry qemu-test-ext4-admission-refusals)
                      targets+=(qemu-test-ext4-rename-wrap-device-powercuts)
                      if [[ "$PHIPIA_EXT4_CUT_OPERATION" != 'all' ]]; then
                          if [[ "$PHIPIA_EXT4_CUT_OPERATION" == 'vfs' ]]; then
                              targets=(qemu-test-ext4-recovery)
                          elif [[ "$PHIPIA_EXT4_CUT_OPERATION" == 'journal-wrap' || "$PHIPIA_EXT4_CUT_OPERATION" == 'dense-file' || "$PHIPIA_EXT4_CUT_OPERATION" == 'geometry' || "$PHIPIA_EXT4_CUT_OPERATION" == 'admission-refusals' || "$PHIPIA_EXT4_CUT_OPERATION" == 'storage-refusals' || "$PHIPIA_EXT4_CUT_OPERATION" == 'metadata-device-cuts' ]]; then
                              targets=("qemu-test-ext4-${PHIPIA_EXT4_CUT_OPERATION}")
                          else
                              targets=("qemu-test-ext4-${PHIPIA_EXT4_CUT_OPERATION}-powercuts")
                          fi
                          printf 'Single operation diagnostic: %s. Full recovery and milestone gates remain required.\n' \
                              "$PHIPIA_EXT4_CUT_OPERATION" >evidence/ext4/SINGLE-CUT-DIAGNOSTIC.txt
                      fi
                  fi
                  make "${targets[@]}" QEMU_ACCEL=tcg \
                      2>&1 | tee evidence/ext4/qemu.log
            - name: Exercise ext4 desktop saves and cold-boot persistence
              if: ${{ !cancelled() && !inputs.ext4_boot_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  make qemu-test-fat32-data qemu-test-ext4-applications qemu-test-ext4-applications-low-space qemu-test-ext4-applications-inodes qemu-test-ext4-notes-inodes qemu-test-ext4-media-export-low-space qemu-test-ext4-media-export-inodes QEMU_ACCEL=tcg \
                      2>&1 | tee evidence/ext4/applications.log
            - name: Exercise ordinary ext4 VFS ENOSPC rollback
              if: ${{ !cancelled() && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  make qemu-test-ext4-space QEMU_ACCEL=tcg 2>&1 | tee evidence/ext4/space.log
            - name: Exercise ordinary ext4 VFS inode exhaustion
              if: ${{ !cancelled() && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  make qemu-test-ext4-inodes QEMU_ACCEL=tcg 2>&1 | tee evidence/ext4/inodes.log
            - name: Exercise ordinary ext4 held-file mutation power cuts
              if: ${{ !cancelled() && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  result=0
                  make qemu-test-ext4-journal-wrap QEMU_ACCEL=tcg \
                      2>&1 | tee evidence/ext4/journal-wrap.log || result=1
                  make qemu-test-ext4-admission-refusals QEMU_ACCEL=tcg \
                      2>&1 | tee evidence/ext4/admission-refusals.log || result=1
                  make qemu-test-ext4-geometry QEMU_ACCEL=tcg \
                      2>&1 | tee evidence/ext4/geometry.log || result=1
                  make qemu-test-ext4-dense-file QEMU_ACCEL=tcg \
                      2>&1 | tee evidence/ext4/dense-file.log || result=1
                  for operation in unlink replace rename rename-errors rename-device rename-cross rename-cross-errors rename-cross-device rename-wrap-device truncate truncate-errors truncate-device grow grow-errors grow-device append append-errors append-device overwrite overwrite-errors chmod chmod-errors chmod-device times times-errors times-device create create-errors create-device mkdir mkdir-errors rmdir rmdir-errors xattr xattr-errors xattr-device xattr-remove xattr-remove-errors xattr-remove-device link link-errors symlink symlink-errors symlink-long symlink-long-errors; do
                      make "qemu-test-ext4-${operation}-powercuts" QEMU_ACCEL=tcg \
                          2>&1 | tee "evidence/ext4/${operation}-powercuts.log" || result=1
                  done
                  exit "$result"
            - name: Exercise ext4 package repair removal and SDL reboot persistence
              if: ${{ !cancelled() && !inputs.ext4_boot_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  mkdir -p evidence/ext4
                  make qemu-test-native-phip QEMU_ACCEL=tcg 2>&1 | tee evidence/ext4/packages.log
            - name: Retain exact-head ext4 evidence, including failures
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: phipia-writable-ext4-${{ github.sha }}
                  path: |
                      evidence/ext4
                      build/tests/ext4-recovery
                      build/tests/ext4-powercuts
                      build/tests/ext4-applications
                      build/tests/ext4-space
                      build/tests/ext4-inodes
                      build/tests/ext4-unlink-powercuts
                      build/tests/fat32-data/serial.log
                      build/tests/native-phip
                      build/*.e2fsck.txt
                      build/*.sha256.txt
                  if-no-files-found: error
                  retention-days: 30
            - name: Run ten complete serial TCG sweeps
              if: ${{ !inputs.ext4_only && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  for sweep in $(seq -w 1 10); do
                      make qemu-tests QEMU_ACCEL=tcg \
                          | tee "evidence/filesystem/tcg-sweep-${sweep}.txt"
                      mkdir -p "evidence/filesystem/tcg-sweep-${sweep}-logs"
                      for log in build/tests/*/serial.log; do
                          scenario=$(basename "$(dirname "$log")")
                          cp "$log" \
                              "evidence/filesystem/tcg-sweep-${sweep}-logs/${scenario}.log"
                      done
                  done
                  proof=evidence/filesystem/tcg-sweep-10-logs/filesystem.log
                  grep -Fx \
                      'ST FAT16 file PHIPIA.BIN bytes 128 reads 4 msix 4 ownership CPU-CONTROLLER-CPU teardown clean robustness 28' \
                      "$proof" >evidence/filesystem/filesystem-proof-transcript.txt
                  grep -Fx 'ST PASS filesystem' "$proof" \
                      >>evidence/filesystem/filesystem-proof-transcript.txt
                  mkdir -p evidence/filesystem/scenario-isos
                  for log in build/tests/*/serial.log; do
                      scenario=$(basename "$(dirname "$log")")
                      make "build/tests/${scenario}/phipia.iso"
                      cp "build/tests/${scenario}/phipia.iso" \
                          "evidence/filesystem/scenario-isos/${scenario}.iso"
                  done
            - name: Record the accelerator safety boundary
              if: ${{ !inputs.ext4_only && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  printf '%s\n' \
                      'KVM not probed or used: the authorization excludes host device files, including /dev/kvm.' \
                      >evidence/filesystem/accelerator-results.txt
                  printf '%s\n' \
                      'Linux runner hardware acceleration is therefore unmeasured by design; TCG completed ten full sweeps.' \
                      >>evidence/filesystem/accelerator-results.txt
            - name: Assemble release evidence
              if: ${{ !inputs.ext4_only && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              shell: bash
              run: |
                  set -o pipefail
                  make iso
                  cp build/phipia.iso \
                      evidence/filesystem/Phipia-filesystem-regression.iso
                  python3 tools/make-fat16-fixture.py \
                      build/tests/filesystem/fat16-fixture.raw
                  fixture_sha=$(
                      sha256sum build/tests/filesystem/fat16-fixture.raw \
                          | awk '{print toupper($1)}'
                  )
                  test "$fixture_sha" = \
                      4B6072C4762E3D59B372CCB0FB83C47F901E2FC1E465C45C438CFD2A6BCD3528
                  scenario_count=$(
                      sed -n '/^TEST_SCENARIOS :=/,/^TEST_TARGETS :=/p' Makefile \
                          | sed '$d; s/^TEST_SCENARIOS :=//; s/\\//g' \
                          | wc -w
                  )
                  assertion_count=$(grep -c 'grep -F\|grep -E' Makefile)
                  read -r expected_scenario_count expected_assertion_count < <(
                      make --no-print-directory -s contract-counts
                  )
                  source_lines=$(
                      find src include -type f -print0 \
                          | sort -z | xargs -0 -r cat | wc -l
                  )
                  test "$scenario_count" -eq "$expected_scenario_count"
                  test "$assertion_count" -eq "$expected_assertion_count"
                  ordinary_record=$(
                      grep -E '^ST LEDGER stages [1-9][0-9]* receipts [1-9][0-9]* capabilities [1-9][0-9]* skips [0-9]+ fingerprint 0x[0-9A-F]{16}$' \
                          evidence/filesystem/tcg-sweep-10-logs/boot-ledger.log
                  )
                  test -n "$ordinary_record"
                  stage_capacity=$(sed -nE \
                      's/^#define BOOT_LEDGER_STAGE_CAPACITY ([0-9]+)U$/\1/p' \
                      include/phipia/boot_ledger.h)
                  receipt_capacity=$(sed -nE \
                      's/^#define BOOT_LEDGER_RECEIPT_CAPACITY ([0-9]+)U$/\1/p' \
                      include/phipia/boot_ledger.h)
                  capability_capacity=$(sed -nE \
                      's/^#define BOOT_STAGE_CAPABILITY_CAPACITY ([0-9]+)U$/\1/p' \
                      include/phipia/boot_ledger.h)
                  test -n "$stage_capacity"
                  test -n "$receipt_capacity"
                  test -n "$capability_capacity"
                  {
                      printf 'Phipia v0.6.0 deterministic FAT16 fixture\n'
                      printf 'logical sectors: 4096\n'
                      printf 'bytes per sector: 4096\n'
                      printf 'BPB LBA: 0\n'
                      printf 'FAT span: LBA 1, 2 sectors\n'
                      printf 'root directory: LBA 3, 128 entries\n'
                      printf 'PHIPIA.BIN data: cluster 2, LBA 4, 128 bytes\n'
                      printf 'payload SHA-256: D399F065C9F21E2FD51E2AEADB7768EAB7E6E45E5150F31227C9711934A4D1D3\n'
                      printf 'image SHA-256: %s\n' "$fixture_sha"
                      printf 'backend: temporary regular file, raw, guest read-only\n'
                  } >evidence/filesystem/fixture-layout-digest.txt
                  {
                      printf 'Phipia Read-Only Filesystem Foundation verification\n'
                      printf 'commit: %s\n' "$GITHUB_SHA"
                      printf 'tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
                      printf 'scenarios per sweep: %s\n' "$scenario_count"
                      printf 'Boot Ledger capacity: %s stages, %s receipts, %s capabilities per stage\n' \
                          "$stage_capacity" "$receipt_capacity" \
                          "$capability_capacity"
                      printf 'ordinary ledger: %s\n' "$ordinary_record"
                      printf 'source lines (src and include): %s\n' "$source_lines"
                      printf 'shell assertion lines: %s\n' "$assertion_count"
                      printf 'kernel bytes: %s\n' "$(stat -c %s build/phipia.elf)"
                      printf 'ISO bytes: %s\n' "$(stat -c %s build/phipia.iso)"
                      printf 'make verify: passed\n'
                      printf 'serial TCG complete sweeps: 10 passed\n'
                      cat evidence/filesystem/accelerator-results.txt
                      printf 'FAT16 proof: 128 bytes, four reads, MSI-X delta 4, ownership complete, teardown clean\n'
                      printf 'controlled robustness results: 28 passed\n'
                  } >evidence/filesystem/verification-summary.txt
                  {
                      printf 'Controlled FAT16 robustness results\n'
                      printf 'Execution: synthetic Rust bytes, guest-only lifecycle hooks, temporary descriptor and exit values.\n'
                      printf 'Result: controls 1-28 passed.\n'
                      printf 'Contract: qemu-test-filesystem and the source assertions in filesystem.c/test.c.\n'
                  } >evidence/filesystem/controlled-robustness-results.txt
                  (
                      cd evidence/filesystem
                      sha256sum \
                          Phipia-filesystem-regression.iso \
                          filesystem-proof-transcript.txt \
                          verification-summary.txt \
                          controlled-robustness-results.txt \
                          fixture-layout-digest.txt \
                          accelerator-results.txt \
                          tcg-sweep-{01..10}.txt >SHA256SUMS
                  )
                  cat evidence/filesystem/verification-summary.txt
                  cat evidence/filesystem/SHA256SUMS
            - name: Upload the bounded milestone evidence
              if: ${{ !inputs.ext4_only && !inputs.ext4_boot_probe && !inputs.ext4_application_probe }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: phipia-filesystem-milestone-${{ github.sha }}
                  path: evidence/filesystem
                  if-no-files-found: error
                  retention-days: 30
