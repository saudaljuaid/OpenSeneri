name: Linux uname ABI milestone evidence

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: linux-abi-milestone-${{ github.ref }}
    cancel-in-progress: true

jobs:
    bounded-evidence:
        name: bounded-linux-uname-abi-evidence
        runs-on: ubuntu-24.04
        timeout-minutes: 360
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
              with:
                  persist-credentials: false
            - name: Install build and trace tools
              shell: bash
              run: |
                  set -euo pipefail
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils build-essential bzip2 clang curl ffmpeg file grub-common \
                      grub-pc-bin lld make mtools qemu-system-x86 qemu-user \
                      strace xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Record the emulated and accelerator surface
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p evidence/linux-abi
                  qemu-system-x86_64 -version \
                      | tee evidence/linux-abi/qemu-version.txt
                  qemu-system-x86_64 -device nvme,help \
                      | tee evidence/linux-abi/qemu-nvme-help.txt
                  qemu-system-x86_64 -accel help \
                      | tee evidence/linux-abi/accelerator-help.txt
                  grep -Fxq tcg evidence/linux-abi/accelerator-help.txt
            - name: Verify source, host contracts, kernel, and fixtures
              run: make verify
            - name: Rebuild and trace both BusyBox profiles twice
              shell: bash
              run: |
                  set -euo pipefail
                  rm -rf build/linux-abi-release build/linux-uname-release
                  bash tools/build-busybox-proof.sh \
                      build/linux-abi-release/build-one \
                      build/linux-abi-release/work-one
                  bash tools/build-busybox-proof.sh \
                      build/linux-abi-release/build-two \
                      build/linux-abi-release/work-two
                  cmp build/linux-abi-release/build-one/busybox \
                      build/linux-abi-release/build-two/busybox
                  cmp build/linux-abi-release/build-one/busybox.config \
                      build/linux-abi-release/build-two/busybox.config
                  cp build/linux-abi-release/build-one/build-record.txt \
                      evidence/linux-abi/reproducible-build-provenance.txt
                  printf 'clean build two binary SHA-256: %s\n' \
                      "$(sha256sum build/linux-abi-release/build-two/busybox | awk '{print toupper($1)}')" \
                      >>evidence/linux-abi/reproducible-build-provenance.txt
                  printf 'two clean source and musl builds: byte-identical\n' \
                      >>evidence/linux-abi/reproducible-build-provenance.txt
                  cp build/linux-abi-release/build-one/syscall-trace.txt \
                      evidence/linux-abi/busybox-syscall-trace.txt
                  cp build/linux-abi-release/build-one/syscall-sequence.txt \
                      evidence/linux-abi/busybox-syscall-sequence.txt
                  cp userspace/busybox/syscall-allowlist.txt \
                      evidence/linux-abi/echo-syscall-allowlist.txt
                  mv evidence/linux-abi/busybox-syscall-trace.txt \
                      evidence/linux-abi/echo-syscall-trace.txt
                  mv evidence/linux-abi/busybox-syscall-sequence.txt \
                      evidence/linux-abi/echo-syscall-sequence.txt
                  mv evidence/linux-abi/reproducible-build-provenance.txt \
                      evidence/linux-abi/echo-reproducible-build-provenance.txt
                  bash tools/build-busybox-uname-proof.sh \
                      build/linux-uname-release/build-one \
                      build/linux-uname-release/work-one
                  bash tools/build-busybox-uname-proof.sh \
                      build/linux-uname-release/build-two \
                      build/linux-uname-release/work-two
                  cmp build/linux-uname-release/build-one/busybox \
                      build/linux-uname-release/build-two/busybox
                  cmp build/linux-uname-release/build-one/busybox.config \
                      build/linux-uname-release/build-two/busybox.config
                  cp build/linux-uname-release/build-one/build-record.txt \
                      evidence/linux-abi/reproducible-build-provenance.txt
                  printf 'clean build two binary SHA-256: %s\n' \
                      "$(sha256sum build/linux-uname-release/build-two/busybox | awk '{print toupper($1)}')" \
                      >>evidence/linux-abi/reproducible-build-provenance.txt
                  printf 'two clean source and musl builds: byte-identical\n' \
                      >>evidence/linux-abi/reproducible-build-provenance.txt
                  cp build/linux-uname-release/build-one/syscall-trace.txt \
                      evidence/linux-abi/syscall-trace.txt
                  cp build/linux-uname-release/build-one/syscall-sequence.txt \
                      evidence/linux-abi/syscall-sequence.txt
                  cp userspace/busybox/uname-syscall-allowlist.txt \
                      evidence/linux-abi/syscall-allowlist.txt
            - name: Run ten complete serial TCG sweeps
              shell: bash
              run: |
                  set -euo pipefail
                  read -r expected_scenario_count _ < <(
                      make --no-print-directory -s contract-counts
                  )
                  scenario_count=$(
                      make --no-print-directory -s contract-scenarios | wc -l
                  )
                  test "$scenario_count" -eq "$expected_scenario_count"
                  for sweep in $(seq -w 1 10); do
                      raw="evidence/linux-abi/tcg-sweep-${sweep}-raw.txt"
                      normalized="evidence/linux-abi/tcg-sweep-${sweep}.txt"
                      make qemu-tests QEMU_ACCEL=tcg | tee "$raw"
                      grep -E '^QEMU scenario [a-z0-9-]+ passed$' \
                          "$raw" >"$normalized"
                      test "$(wc -l <"$normalized")" -eq "$scenario_count"
                      cp build/tests/linux-abi/serial.log \
                          "evidence/linux-abi/linux-abi-sweep-${sweep}.log"
                      cp build/tests/linux-abi-uname/serial.log \
                          "evidence/linux-abi/linux-uname-sweep-${sweep}.log"
                      rm "$raw"
                  done
                  proof=evidence/linux-abi/linux-abi-sweep-10.log
                  grep -Fx 'PHIPIA' "$proof" \
                      >evidence/linux-abi/stable-busybox-transcript.txt
                  grep -Fx \
                      'ST LINUX ABI busybox echo bytes 7 syscalls 9 stdout valid exit 0 ring 3 address-space private teardown clean robustness 72' \
                      "$proof" >>evidence/linux-abi/stable-busybox-transcript.txt
                  grep -Fx 'ST PASS linux-abi' "$proof" \
                      >>evidence/linux-abi/stable-busybox-transcript.txt
                  uname_proof=evidence/linux-abi/linux-uname-sweep-10.log
                  grep -Fx 'Linux' "$uname_proof" \
                      >evidence/linux-abi/stable-uname-transcript.txt
                  grep -Fx \
                      'ST LINUX ABI busybox uname bytes 6 syscalls 6 output valid exit 0 ring 3 address-space private copy-out valid teardown clean robustness 97' \
                      "$uname_proof" >>evidence/linux-abi/stable-uname-transcript.txt
                  grep -Fx 'ST PASS linux-abi-uname' "$uname_proof" \
                      >>evidence/linux-abi/stable-uname-transcript.txt
                  cp build/tests/boot-ledger/serial.log \
                      evidence/linux-abi/ordinary-ledger.log
                  rm evidence/linux-abi/linux-abi-sweep-*.log
                  rm evidence/linux-abi/linux-uname-sweep-*.log
            - name: Record accelerator availability without host-device probes
              shell: bash
              run: |
                  set -euo pipefail
                  read -r expected_scenario_count _ < <(
                      make --no-print-directory -s contract-counts
                  )
                  scenario_count=$(
                      make --no-print-directory -s contract-scenarios | wc -l
                  )
                  test "$scenario_count" -eq "$expected_scenario_count"
                  {
                      printf 'TCG available: ten complete %s-scenario sweeps passed.\n' \
                          "$scenario_count"
                      printf 'KVM unavailable by authorization: no host device file was probed or opened.\n'
                      printf 'WHPX unavailable on this Linux runner.\n'
                      printf 'HVF unavailable on this Linux runner.\n'
                      printf 'NVMM unavailable on this Linux runner.\n'
                      printf 'HAX unavailable on this Linux runner.\n'
                      printf 'Safely exposed hardware accelerators on this runner: none.\n'
                  } >evidence/linux-abi/accelerator-results.txt
            - name: Assemble bounded v0.9.0 release evidence
              shell: bash
              run: |
                  set -euo pipefail
                  release=evidence/linux-abi
                  first=build/linux-uname-release/build-one
                  make iso
                  cp build/phipia.iso "$release/Phipia-v0.9.0.iso"
                  cp build/phipia.elf "$release/phipia-v0.9.0.elf"
                  cp "$first/busybox" "$release/busybox-uname"
                  cp userspace/busybox/busybox-uname.config \
                      "$release/busybox-uname.config"
                  cp userspace/busybox/BUSYBOX-LICENSE \
                      "$release/BUSYBOX-LICENSE"
                  cp userspace/busybox/MUSL-COPYRIGHT \
                      "$release/MUSL-COPYRIGHT"
                  cp userspace/busybox/source/busybox-1.38.0.tar.bz2 \
                      "$release/busybox-1.38.0.tar.bz2"
                  cp userspace/busybox/source/musl-1.2.6.tar.gz \
                      "$release/musl-1.2.6.tar.gz"
                  cp tools/build-busybox-uname-proof.sh \
                      "$release/build-busybox-uname-proof.sh"
                  cp tools/check-exercised-instructions.py \
                      "$release/check-exercised-instructions.py"
                  cp userspace/busybox/musl-vfprintf-scalar.h \
                      "$release/musl-vfprintf-scalar.h"
                  python3 tools/make-linux-uname-fixture.py "$first/busybox" \
                      build/linux-uname-release/linux-uname-fat16.raw
                  fixture_sha=$(
                      sha256sum build/linux-uname-release/linux-uname-fat16.raw \
                          | awk '{print toupper($1)}'
                  )
                  test "$fixture_sha" = \
                      CDB8E920F06AC93F63E73854FC5A6A63CDBCC7DCEDBBFB62325C7EC4B408AD36
                  {
                      printf 'Phipia v0.9.0 deterministic Linux uname fixture\n'
                      printf 'logical sectors / bytes: 4096 / 4096\n'
                      printf 'FAT: LBA 1-2; root: LBA 3, 128 entries\n'
                      printf 'UNAMEBOX: clusters 2-11, LBA 4-13, 38368 bytes\n'
                      printf 'BUSYBOX SHA-256: 389AD6B13804EB7307BA589C8E8A7C702F91302005A7C5FC6E9E99124FCEAF43\n'
                      printf 'fixture SHA-256: %s\n' "$fixture_sha"
                      printf 'backend: repository-workspace regular file, raw, guest read-only\n'
                  } >"$release/fixture-layout-digests.txt"
                  {
                      printf 'Linux x86-64 struct utsname: 390 bytes, alignment 1\n'
                      printf 'fields: sysname/nodename/release/version/machine/domainname; 65 bytes each\n'
                      printf 'values: Linux | phipia | 0.9.0-phipia | Phipia | x86_64 | (none)\n'
                      printf 'identity source: immutable Phipia-owned record; no host-derived field\n'
                  } >"$release/deterministic-uts-record.txt"
                  {
                      printf 'FullMAC remains future and blocked on an upstream ordinary QEMU FullMAC device-and-peer model.\n'
                      printf 'Observed QEMU surfaces: local 11.1.0 and CI 8.2.2 exposed no ordinary FullMAC device or deterministic WPA2 peer.\n'
                  } >"$release/fullmac-feasibility-reference.txt"
                  {
                      printf 'BusyBox 1.38.0: GPL-2.0-or-later separate userspace work.\n'
                      printf 'Exact source archive, complete configuration, LICENSE, build script, and checksums are distributed.\n'
                      printf 'musl 1.2.6: MIT-licensed static-libc toolchain source; exact source and COPYRIGHT are distributed.\n'
                      printf 'Neither BusyBox nor musl is linked into or copied into the GPL-3.0-only Phipia kernel.\n'
                  } >"$release/source-license-record.txt"
                  ordinary_record=$(
                      grep -E '^ST LEDGER stages [1-9][0-9]* receipts [1-9][0-9]* capabilities [1-9][0-9]* skips [0-9]+ fingerprint 0x[0-9A-F]{16}$' \
                          "$release/ordinary-ledger.log"
                  )
                  test -n "$ordinary_record"
                  rm "$release/ordinary-ledger.log"
                  read -r expected_scenario_count expected_assertion_count < <(
                      make --no-print-directory -s contract-counts
                  )
                  scenario_count=$(
                      make --no-print-directory -s contract-scenarios | wc -l
                  )
                  assertion_count=$(grep -c 'grep -F\|grep -E' Makefile)
                  test "$scenario_count" -eq "$expected_scenario_count"
                  test "$assertion_count" -eq "$expected_assertion_count"
                  source_lines=$(
                      find src include -type f -print0 \
                          | sort -z | xargs -0 -r cat | wc -l
                  )
                  stage_capacity=$(sed -nE \
                      's/^#define BOOT_LEDGER_STAGE_CAPACITY ([0-9]+)U$/\1/p' \
                      include/phipia/boot_ledger.h)
                  receipt_capacity=$(sed -nE \
                      's/^#define BOOT_LEDGER_RECEIPT_CAPACITY ([0-9]+)U$/\1/p' \
                      include/phipia/boot_ledger.h)
                  capability_capacity=$(sed -nE \
                      's/^#define BOOT_STAGE_CAPABILITY_CAPACITY ([0-9]+)U$/\1/p' \
                      include/phipia/boot_ledger.h)
                  test -n "$stage_capacity"
                  test -n "$receipt_capacity"
                  test -n "$capability_capacity"
                  {
                      printf 'Phipia v0.9.0 Linux Uname ABI Foundation verification\n'
                      printf 'commit: %s\n' "$GITHUB_SHA"
                      printf 'tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
                      printf 'scenarios per sweep: %s\n' "$scenario_count"
                      printf 'Boot Ledger capacity: %s stages, %s receipts, %s capabilities per stage\n' \
                          "$stage_capacity" "$receipt_capacity" \
                          "$capability_capacity"
                      printf 'ordinary ledger: %s\n' "$ordinary_record"
                      printf 'source lines (src and include): %s\n' "$source_lines"
                      printf 'shell assertion lines: %s\n' "$assertion_count"
                      printf 'kernel bytes: %s\n' "$(stat -c %s build/phipia.elf)"
                      printf 'ISO bytes: %s\n' "$(stat -c %s build/phipia.iso)"
                      printf 'make verify: passed without warnings\n'
                      printf 'all %s scenarios: passed individually\n' \
                          "$scenario_count"
                      printf 'serial TCG complete sweeps: 10 passed\n'
                      cat "$release/accelerator-results.txt"
                      printf 'BusyBox echo preservation: independent pinned build and trace passed\n'
                      printf 'BusyBox uname reproducibility: two clean builds byte-identical\n'
                      printf 'ELF/runtime: static ET_EXEC, no interpreter, relocation, GOT dependency, or RWX segment\n'
                      printf 'instruction audit: no floating-point, MMX, SSE, or AVX in kernel or exercised echo/uname text\n'
                      printf 'execution: CPL3 fetch from NVMe image, real SYSCALL entry and RDI uname pointer; int 0x81 excluded\n'
                      printf 'syscall semantics: invalid uname pointers return -EFAULT without partial writes; unknown calls return -ENOSYS\n'
                      printf 'teardown: kernel CR3 and complete safe resource census restored\n'
                      printf 'controlled uname robustness results: 97 passed\n'
                  } >"$release/verification-summary.txt"
                  {
                      printf 'Controlled Linux uname ABI robustness results\n'
                      printf 'Rust mutation tests, UTS/copy-out controls, guest foundation controls, installed permission/provenance checks, and source/host contracts passed.\n'
                      printf 'Result: controls 1-97 passed.\n'
                      printf 'Contract: docs/LINUX_SYSCALL_ABI.md plus workflow and source assertions.\n'
                  } >"$release/controlled-robustness-results.txt"
                  rm -f "$release/SHA256SUMS"
                  (
                      cd "$release"
                      find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
                          | sort -z | xargs -0 sha256sum >SHA256SUMS
                  )
                  cat "$release/verification-summary.txt"
                  cat "$release/SHA256SUMS"
            - name: Upload v0.9.0 milestone evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: phipia-linux-uname-milestone-${{ github.sha }}
                  path: evidence/linux-abi
                  if-no-files-found: error
                  retention-days: 30
