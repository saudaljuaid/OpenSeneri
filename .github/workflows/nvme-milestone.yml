name: NVMe milestone evidence

on:
    pull_request:
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: nvme-milestone-${{ github.ref }}
    cancel-in-progress: true

jobs:
    bounded-evidence:
        name: bounded-nvme-evidence
        runs-on: ubuntu-24.04
        # The complete 117-scenario matrix now includes the four-boot signed
        # package lifecycle. Keep the full hosted-runner allowance so all ten
        # serial TCG sweeps and evidence assembly can complete.
        timeout-minutes: 360
        steps:
            - name: Check out source
              uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
            - name: Install build tools
              run: |
                  sudo sed -i '\|azure.archive.ubuntu.com|d' /etc/apt/apt-mirrors.txt
                  sudo apt-get update
                  sudo apt-get install --yes --no-install-recommends \
                      binutils clang ffmpeg gcc grub-common grub-pc-bin lld \
                      make mtools qemu-system-x86 xorriso
            - name: Install the Rust bare-metal target
              run: rustup target add x86_64-unknown-none
            - name: Record the fixture and accelerator surface
              run: |
                  mkdir -p evidence/nvme
                  qemu-system-x86_64 -version | tee evidence/nvme/qemu-version.txt
                  qemu-system-x86_64 -device nvme,help \
                      | tee evidence/nvme/qemu-nvme-help.txt
                  qemu-system-x86_64 -accel help \
                      | tee evidence/nvme/accelerator-help.txt
            - name: Verify the kernel artifact
              run: make verify
            - name: Run ten complete serial TCG sweeps
              shell: bash
              run: |
                  set -o pipefail
                  for sweep in $(seq -w 1 10); do
                      make qemu-tests QEMU_ACCEL=tcg \
                          | tee "evidence/nvme/tcg-sweep-${sweep}.txt"
                      mkdir -p "evidence/nvme/tcg-sweep-${sweep}-logs"
                      for log in build/tests/*/serial.log; do
                          scenario=$(basename "$(dirname "$log")")
                          cp "$log" \
                              "evidence/nvme/tcg-sweep-${sweep}-logs/${scenario}.log"
                      done
                  done
                  cp evidence/nvme/tcg-sweep-10-logs/nvme.log \
                      evidence/nvme/nvme-proof-transcript.txt
                  mkdir -p evidence/nvme/scenario-isos
                  # GNU Make treats the per-scenario ISO as an intermediate of
                  # qemu-test-%, so request each one explicitly before copying.
                  for log in build/tests/*/serial.log; do
                      scenario=$(basename "$(dirname "$log")")
                      make "build/tests/${scenario}/phipia.iso"
                      cp "build/tests/${scenario}/phipia.iso" \
                          "evidence/nvme/scenario-isos/${scenario}.iso"
                  done
            - name: Record the CI hardware-accelerator safety boundary
              shell: bash
              run: |
                  printf '%s\n' \
                      'KVM not probed or used: the authorized task forbids access to host device files, including /dev/kvm.' \
                      | tee evidence/nvme/accelerator-results.txt
                  printf '%s\n' \
                      'Linux runner hardware-accelerator availability therefore remains unmeasured by design.' \
                      | tee -a evidence/nvme/accelerator-results.txt
            - name: Assemble release evidence
              shell: bash
              run: |
                  set -o pipefail
                  make iso
                  cp build/phipia.iso evidence/nvme/Phipia-nvme-regression.iso
                  proof=evidence/nvme/nvme-proof-transcript.txt
                  expected_lines=(
                      'Phipia: NVMe foundation robustness controls 20/20 passed'
                      'Phipia: NVMe controller ready'
                      'Phipia: NVMe namespace ready'
                      'Phipia: NVMe block read completed: 4096 bytes'
                      'Phipia: NVMe MSI-X read completion count 1'
                      'Phipia: NVMe DMA ownership CPU-CONTROLLER-CPU complete'
                      'Phipia: NVMe teardown complete'
                      'ST NVME read 4096 msix 1 ownership CPU-CONTROLLER-CPU teardown clean robustness 22'
                  )
                  for expected_line in "${expected_lines[@]}"; do
                      if ! grep -Fxq "$expected_line" "$proof"; then
                          printf 'Missing NVMe evidence: %s\n' "$expected_line" >&2
                          exit 1
                      fi
                  done
                  proof_record=$(grep -Fx \
                      'ST NVME read 4096 msix 1 ownership CPU-CONTROLLER-CPU teardown clean robustness 22' \
                      "$proof")
                  scenario_count=$(
                      sed -n '/^TEST_SCENARIOS :=/,/^TEST_TARGETS :=/p' Makefile \
                          | sed '$d; s/^TEST_SCENARIOS :=//; s/\\//g' \
                          | wc -w
                  )
                  assertion_count=$(grep -c 'grep -F\|grep -E' Makefile)
                  read -r expected_scenario_count expected_assertion_count < <(
                      make --no-print-directory -s contract-counts
                  )
                  if test "$scenario_count" -ne "$expected_scenario_count" || \
                      test "$assertion_count" -ne "$expected_assertion_count"; then
                      printf 'Measured contract drifted: %s scenarios, %s assertion lines.\n' \
                          "$scenario_count" "$assertion_count" >&2
                      exit 1
                  fi
                  python3 tools/make-nvme-fixture.py \
                      build/tests/nvme/nvme-fixture.raw
                  fixture_sha=$(
                      sha256sum build/tests/nvme/nvme-fixture.raw \
                          | awk '{print $1}'
                  )
                  {
                      printf 'Phipia NVMe Block Storage Foundation verification\n'
                      printf 'commit: %s\n' "$GITHUB_SHA"
                      printf 'tree: %s\n' "$(git rev-parse 'HEAD^{tree}')"
                      printf 'scenarios per sweep: %s\n' "$scenario_count"
                      printf 'shell assertion lines: %s\n' "$assertion_count"
                      printf 'fixture SHA-256: %s\n' "$fixture_sha"
                      printf 'fixture backend: temporary regular file, raw, guest read-only\n'
                      printf 'make verify: passed\n'
                      printf 'serial TCG complete sweeps: 10 passed\n'
                      cat evidence/nvme/accelerator-results.txt
                      printf '%s\n' \
                          'NVMe read proof: 4096 bytes, MSI-X delta 1, ownership CPU-CONTROLLER-CPU, teardown clean'
                      printf '%s\n' \
                          'controlled robustness results: 22 passed'
                  } >evidence/nvme/verification-summary.txt
                  {
                      printf 'Controlled NVMe robustness results\n'
                      printf 'Execution: deterministic guest-local values and explicit test hooks only.\n'
                      printf 'Result: %s\n' "$proof_record"
                      printf 'Contract: qemu-test-nvme and the source assertions in nvme.c/test.c.\n'
                  } >evidence/nvme/controlled-robustness-results.txt
                  (
                      cd evidence/nvme
                      find . -type f ! -name SHA256SUMS -print0 \
                          | LC_ALL=C sort -z \
                          | xargs -0 -r sha256sum >SHA256SUMS
                  )
                  cat evidence/nvme/verification-summary.txt
                  printf 'SHA256SUMS members: %s\n' \
                      "$(wc -l <evidence/nvme/SHA256SUMS)"
                  sha256sum evidence/nvme/SHA256SUMS
            - name: Upload the bounded milestone evidence
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: phipia-nvme-milestone-${{ github.sha }}
                  path: evidence/nvme
                  if-no-files-found: error
                  retention-days: 30
